<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تم الدفع بنجاح | Vesion Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="result-page">
    <div class="result-card">
      <div class="result-icon success">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <h1>تم الدفع بنجاح!</h1>
      <p>شكراً لشرائك Mini Chat - Pro. بترسللك رسالة تأكيد فيها تفاصيل الطلب (وضع تجريبي — ما بترسل إيميل حقيقي).</p>
      <a href="/" class="btn btn-primary">رجوع للمتجر</a>
      <p class="order-id" id="orderId"></p>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(window.location.search);
    const sessionId = params.get('session_id');
    if (sessionId) {
      document.getElementById('orderId').textContent = 'رقم الجلسة: ' + sessionId;
    }
  </script>
</body>
</html>
