<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenReel Studio</title>
  <meta name="description" content="Free, self-hosted AI video generation studio">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%23ff5ca8'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Cpath d='M12 9l12 7-12 7z' fill='white'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" aria-label="Main navigation">
      <a class="brand" href="#/create">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">OpenReel<small>Studio</small></span>
      </a>
      <nav class="nav" id="nav">
        <a href="#/create" data-route="create"><span data-icon="sparkles"></span><span>Create</span></a>
        <a href="#/videos" data-route="videos"><span data-icon="film"></span><span>My Videos</span></a>
        <a href="#/projects" data-route="projects"><span data-icon="folder"></span><span>Projects</span></a>
        <a href="#/templates" data-route="templates"><span data-icon="layout"></span><span>Templates</span></a>
        <a href="#/settings" data-route="settings"><span data-icon="settings"></span><span>Settings</span></a>
      </nav>
      <a class="engine-pill" id="enginePill" href="#/settings" title="Video engine status">
        <span class="dot"></span><span class="label">Checking engine…</span>
      </a>
    </aside>
    <main class="main" id="main" tabindex="-1"></main>
  </div>
  <div class="toasts" id="toasts" role="status" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
